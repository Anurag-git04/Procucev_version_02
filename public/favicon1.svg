<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rounded Square Clip Path -->
    <clipPath id="icon-clip">
      <rect width="512" height="512" rx="96" ry="96" />
    </clipPath>

    <!-- Background Blue Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#003380" />
    </linearGradient>

    <!-- Cyan to Purple Gradient for the Map Dots -->
    <linearGradient id="map-grad" x1="15%" y1="75%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="45%" stop-color="#5c6bc0" />
      <stop offset="100%" stop-color="#d500f9" />
    </linearGradient>

    <!-- Dotted Grid Pattern -->
    <pattern id="dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="url(#map-grad)" />
    </pattern>

    <!-- World Map Silhouette Mask (Africa & Eurasia region from logo) -->
    <mask id="map-mask">
      <rect width="512" height="512" fill="black" />
      <g fill="white">
        <!-- Africa / Lower Continent Mass -->
        <path d="M135,175 C165,165 215,170 250,195 C275,215 290,265 280,315 C270,365 235,435 195,435 C165,435 155,375 145,335 C120,305 85,275 95,230 C105,195 115,185 135,175 Z" />
        <!-- Eurasia / Upper-Right Continent Mass -->
        <path d="M150,45 C255,35 385,40 465,65 C495,95 490,175 455,220 C420,265 375,245 335,230 C295,215 255,195 215,170 C165,145 125,120 130,80 C135,55 140,45 150,45 Z" />
      </g>
    </mask>

    <!-- Subtle Drop Shadow for the 'P' -->
    <filter id="p-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001940" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Main Clipped Favicon Group -->
  <g clip-path="url(#icon-clip)">
    <!-- 1. Blue Rounded Background -->
    <rect width="512" height="512" fill="url(#bg-grad)" />

    <!-- 2. Dotted World Map -->
    <rect width="512" height="512" fill="url(#dots)" mask="url(#map-mask)" opacity="0.9" />

    <!-- 3. Intersecting Cyan Network Lines -->
    <g stroke="#00e5ff" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="-20" y1="80" x2="530" y2="365" />
      <line x1="160" y1="-20" x2="365" y2="530" />
      <line x1="230" y1="-20" x2="185" y2="395" />
      <line x1="-20" y1="300" x2="530" y2="90" />
      <line x1="-20" y1="375" x2="220" y2="195" />
      <line x1="-20" y1="450" x2="530" y2="420" />
    </g>

    <!-- 4. Stylized White "P" Mark -->
    <path filter="url(#p-shadow)" fill="#ffffff" fill-rule="evenodd" d="
      M 124,206
      C 124,166 154,136 194,136
      L 315,136
      C 365,136 398,168 398,216
      L 398,232
      C 398,280 365,312 315,312
      L 196,312
      C 196,274 222,252 260,252
      L 315,252
      C 332,252 342,242 342,226
      L 342,218
      C 342,202 332,192 315,192
      L 182,192
      L 182,360
      C 182,395 156,420 124,420
      Z" />
  </g>
</svg>
